services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # NOT: Portu disariya (host'a) hic acmiyoruz - sadece bu compose'daki
    # diger servisler (backend) Docker'in kendi ic aginda erisebiliyor.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Faz 4d: context repo koku - backend/Dockerfile artik `shared/`
      # klasorune (kanonik program semasi, tek kaynak) de ihtiyac duyuyor,
      # bu dosya build context'i backend/e sinirliyken erisilemezdi (bkz.
      # backend/Dockerfile yorumu, docs/decisions.md "Faz 4d").
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://beacon.photofocustr.com
      REDIS_URL: redis://redis:6379
      API_PREFIX: api
      PORT: 3001
      # Asagidaki degiskenler oncesinde .env.prod'da TANIMLIYDI ama bu
      # servise HIC GECIRILMIYORDU - process.env.X okuyan kod container
      # icinde daima bos gorup ilgili ozelligi (e-posta/push/LLM cikarimi/
      # mutlak gorsel URL'leri) sessizce devre disi birakiyordu, hicbir
      # hata vermeden (bkz. docs/KURULUM.md "Onemli" notu, docs/KARARLAR.md
      # "Prod hazirlik"). `${VAR}` bos ise Docker Compose bunu container'a
      # BOS STRING olarak geçirir - kod tarafi zaten bos/tanimsiz stringi
      # "yapilandirilmamis" sayacak sekilde yazildigi icin bu davranis
      # NIYET EDILEN "zarif dusme" ile birebir tutarlidir.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
    # Yuklenen gorseller (Faz 3, backend/src/uploads) konteyner icinde
    # /app/uploads'a yaziliyor (Dockerfile WORKDIR /app). Bu volume OLMADAN
    # her `up -d --build backend` (yeniden deploy) konteyneri SIFIRDAN
    # olusturur ve o ana kadar yuklenmis TUM gorseller kaybolur - bu satir
    # olmadan "eski dosya diskten silindi" davranisi da anlamsizlasir
    # (zaten hicbir sey kalici degil). DB'deki imageUrl/coverImageUrl vb.
    # kayitlar bu volume'a bagimlidir.
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://beacon.photofocustr.com/api
        NEXT_BASE_PATH: /yetkili
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - web

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
  backend-uploads:
