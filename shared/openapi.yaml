      properties:
        statusCode:
          type: integer
          example: 401
        message:
          description: >-
            Tek bir hata icin string, class-validator dogrulama hatalari
            icin (400) string dizisi olabilir.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          example: Unauthorized

    Congress:
      type: object
      required:
        - id
        - name
        - code
        - accessCode
        - beaconUuid
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          description: Kisa, insan-okunabilir kongre kodu (pilot login icin kullanilir).
        accessCode:
          type: string
          description: Pilot ortak erisim kodu (gercek kongrede kayit sistemiyle degisecek).
        beaconUuid:
          type: string
          format: uuid
          description: Kongreye ait ortak iBeacon UUID'i.
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        observationIntervalSeconds:
          type: integer
          description: >-
            Mobil cihazlarin observation batch gonderim sikligi (saniye).
            Panelden (canli takip sayfasi) ayarlanir.
        emaAlpha:
          type: number
          description: >-
            EMA yumusatma katsayisi. 1'e yaklastikca sistem yeni olcume daha
            hizli tepki verir, gurultuye de daha acik olur.
        hampelK:
          type: number
          description: Hampel outlier filtresinin siddeti (kucukse daha cok okuma elenir).
        hampelWindowSize:
          type: integer
          description: Outlier tespitinde bakilan son okuma sayisi.
        confidenceTemperature:
          type: number
          description: Softmax sicakligi; buyudukce salon yuzdeleri birbirine yaklasir.
        entryProbabilityThreshold:
          type: number
          description: Giris icin gereken guven yuzdesi. Cikis esiginden buyuk olmalidir.
        exitProbabilityThreshold:
          type: number
          description: Altina dusuldugunde cikis sayilan guven yuzdesi.
        ambiguityMarginPct:
          type: number
          description: >-
            Ilk iki salonun yuzde farki bunun altindaysa sistem taraf secmez
            (AMBIGUOUS) ve ne giris ne cikis tetikler.
        staleGraceSeconds:
          type: number
          description: >-
            Bir beacon'in son gecerli okumasindan sonra kac saniye daha
            "hala guvenilir" sayilip son bilinen (donmus) EMA'siyla salon
            ortalamasina dahil edilmeye devam edecegi. Tek beacon'li bir
            salonun kisa sureli sinyal kesintisinde rakip salona sahte
            gecisi (aninda EXIT+ENTRY) onlemek icin eklendi.
        fullName:
          type: string
          nullable: true
          description: Mobil ana sayfa kongre karti icin acik/tam kongre adi (Faz 3).
        description:
          type: string
          nullable: true
          description: Mobil ana sayfa kongre karti icin serbest metin aciklama.
        coverImageUrl:
          type: string
          nullable: true
          description: >-
            /admin/uploads ile yuklenen kapak gorselinin goreli yolu (ornek:
            /uploads/<congressId>/<uuid>.png). API_URL ile birlestirilerek
            kullanilir.
        websiteUrl:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CongressCreate:
      type: object
      required:
        - name
        - code
        - accessCode
        - beaconUuid
      properties:
        name:
          type: string
          minLength: 2
        code:
          type: string
          minLength: 2
        accessCode:
          type: string
          minLength: 4
        beaconUuid:
          type: string
          format: uuid
        fullName:
          type: string
        description:
          type: string
        coverImageUrl:
          type: string
        websiteUrl:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        observationIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 10
        emaAlpha:
          type: number
          minimum: 0.01
          maximum: 1
          default: 0.35
        hampelK:
          type: number
          minimum: 0.5
          maximum: 10
          default: 3
        hampelWindowSize:
          type: integer
          minimum: 3
          maximum: 20
          default: 5
        confidenceTemperature:
          type: number
          minimum: 0.5
          maximum: 50
          default: 8
        entryProbabilityThreshold:
          type: number
          minimum: 0
          maximum: 100
          default: 60
        exitProbabilityThreshold:
          type: number
          minimum: 0
          maximum: 100
          default: 40
        ambiguityMarginPct:
          type: number
          minimum: 0
          maximum: 50
          default: 5
        staleGraceSeconds:
          type: number
          minimum: 0
          maximum: 60
          default: 5

    CongressUpdate:
