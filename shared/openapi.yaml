      operationId: reorderVenues
      tags:
        - Content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '204':
          description: Sira guncellendi.

  /admin/venues/{id}:
    patch:
      summary: Mekani guncelle
      operationId: updateVenue
      tags:
        - Content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueUpdate'
      responses:
        '200':
          description: Guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          description: Mekan bulunamadi.
    delete:
      summary: Mekani sil
      description: Gorseli varsa diskten de silinir.
      operationId: deleteVenue
      tags:
        - Content
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Silindi.
        '404':
          description: Mekan bulunamadi.

  /admin/announcements:
    get:
      summary: Bir kongrenin duyurularini listele
      description: >-
        Once isPinned=true olanlar, sonra publishedAt azalan sirada doner.
        publishedAt=null olan kayitlar TASLAKTIR (mobilde gorunmez).
      operationId: listAnnouncements
      tags:
        - Content
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Duyuru listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
    post:
      summary: Yeni duyuru olustur (taslak olarak baslar)
      operationId: createAnnouncement
      tags:
        - Content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '201':
          description: Duyuru olusturuldu (publishedAt=null, taslak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
        '404':
          description: congressId ile eslesen kongre bulunamadi.

  /admin/announcements/reorder:
    post:
      summary: Duyurularin gosterim sirasini topluca degistir
      operationId: reorderAnnouncements
      tags:
        - Content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
