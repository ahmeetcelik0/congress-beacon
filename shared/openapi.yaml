  /admin/program-imports/{id}/approve:
    post:
      summary: Staging'i tek transaction'da canli programa isle
      description: >-
        INVALID/EXCLUDED satirlar atlanir. Basliksiz sunumlar atlanir
        (Presentation.title NOT NULL). Mevcut programin UZERINE YAZMAZ,
        yanina ekler. hallId eksik NEW bir oturum varsa 400 ile hangi
        oturumlarin eksik oldugu listelenir, transaction hic BASLAMAZ.
      operationId: approveProgramImport
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Canliya islendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramImportApproveSummary'
        '400':
          description: Salon secilmemis oturumlar var.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                          nullable: true
                        rowOrder:
                          type: integer
        '404':
          description: Yukleme bulunamadi.
        '409':
          description: Yukleme zaten sonuclandirilmis (ikinci onay).

