openapi: 3.0.3
info:
  title: Kongre Beacon API
  description: Kongre Beacon Sistemi backend API sozlesmesi.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Yerel gelistirme
paths:
  /health:
    get:
      summary: Servis saglik kontrolu
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Servis ayakta.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /congresses:
    post:
      summary: Yeni kongre olustur
      operationId: createCongress
      tags:
        - Congress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CongressCreate'
      responses:
        '201':
          description: Kongre olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Congress'
        '400':
          description: Gecersiz istek govdesi.
    get:
      summary: Kongreleri listele
      operationId: listCongresses
      tags:
        - Congress
      responses:
        '200':
          description: Kongre listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Congress'

  /congresses/{id}:
    get:
      summary: Tek bir kongreyi getir
      operationId: getCongress
      tags:
        - Congress
      parameters:
        - $ref: '#/components/parameters/CongressId'
      responses:
        '200':
          description: Kongre bulundu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Congress'
        '404':
          description: Kongre bulunamadi.
    patch:
      summary: Kongreyi guncelle
      operationId: updateCongress
      tags:
        - Congress
      parameters:
        - $ref: '#/components/parameters/CongressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CongressUpdate'
      responses:
        '200':
          description: Kongre guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Congress'
        '404':
          description: Kongre bulunamadi.
    delete:
      summary: Kongreyi sil
      operationId: deleteCongress
      tags:
        - Congress
      parameters:
        - $ref: '#/components/parameters/CongressId'
      responses:
        '204':
          description: Kongre silindi.
        '404':
          description: Kongre bulunamadi.

  /halls:
    post:
      summary: Yeni salon olustur
      operationId: createHall
      tags:
        - Hall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HallCreate'
      responses:
        '201':
          description: Salon olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
        '400':
          description: Gecersiz istek govdesi.
        '404':
          description: congressId ile eslesen kongre bulunamadi.
    get:
      summary: Salonlari listele
      operationId: listHalls
      tags:
        - Hall
      parameters:
        - name: congressId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Salon listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hall'

  /halls/{id}:
    get:
      summary: Tek bir salonu getir
      operationId: getHall
      tags:
        - Hall
      parameters:
        - $ref: '#/components/parameters/HallId'
      responses:
        '200':
          description: Salon bulundu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
        '404':
          description: Salon bulunamadi.
    patch:
      summary: Salonu guncelle (isim, rssiThreshold)
      operationId: updateHall
      tags:
        - Hall
      parameters:
        - $ref: '#/components/parameters/HallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HallUpdate'
      responses:
        '200':
          description: Salon guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
        '404':
          description: Salon bulunamadi.
    delete:
      summary: Salonu sil
      operationId: deleteHall
      tags:
        - Hall
      parameters:
        - $ref: '#/components/parameters/HallId'
      responses:
        '204':
          description: Salon silindi.
        '404':
          description: Salon bulunamadi.

components:
  parameters:
    CongressId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HallId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Congress:
      type: object
      required:
        - id
        - name
        - beaconUuid
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        beaconUuid:
          type: string
          format: uuid
          description: Kongreye ait ortak iBeacon UUID'i.
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CongressCreate:
      type: object
      required:
        - name
        - beaconUuid
      properties:
        name:
          type: string
          minLength: 2
        beaconUuid:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    CongressUpdate:
      type: object
      description: CongressCreate ile ayni alanlar, hepsi opsiyonel (PATCH).
      properties:
        name:
          type: string
          minLength: 2
        beaconUuid:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    Hall:
      type: object
      required:
        - id
        - congressId
        - name
        - rssiThreshold
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        congressId:
          type: string
          format: uuid
        name:
          type: string
        rssiThreshold:
          type: integer
          description: Salon icinde kabul edilen minimum RSSI (dBm). Varsayilan -70.
          example: -70
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HallCreate:
      type: object
      required:
        - congressId
        - name
      properties:
        congressId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
        rssiThreshold:
          type: integer
          minimum: -100
          maximum: 0
          description: Verilmezse -70 kullanilir.

    HallUpdate:
      type: object
      description: HallCreate ile ayni alanlar (congressId haric), hepsi opsiyonel (PATCH).
      properties:
        name:
          type: string
          minLength: 2
        rssiThreshold:
          type: integer
          minimum: -100
          maximum: 0
