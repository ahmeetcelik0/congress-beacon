components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CongressId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HallId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeaconId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HallIdPath:
      name: hallId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeaconIdPath:
      name: beaconId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HallOccupancy:
      type: object
      required:
        - hallId
        - hallName
        - count
      properties:
        hallId:
          type: string
          format: uuid
        hallName:
          type: string
        count:
          type: integer

    TrackingHealthItem:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - devicePlatform
        - deviceAppVersion
        - lastObservationAt
        - status
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        devicePlatform:
          type: string
          nullable: true
          enum: [IOS, ANDROID, null]
        deviceAppVersion:
          type: string
          nullable: true
        lastObservationAt:
          type: string
          format: date-time
          nullable: true
        status:
          description: Cihazin veri gonderme sagligi (son gozlem zamanina gore).
          type: string
          enum: [aktif, yakin_zamanda, veri_yok]
        currentStatus:
          description: >
            Katilimcinin salon tespit algoritmasina gore anlik durumu.
            NO_SIGNAL iki durumu birlestirir: sinyal var ama hicbir salon
            esigini gecmiyor, ya da cihaz tamamen sessiz. Ayrim `status`
            alaniyla yapilir (status=veri_yok ise cihaz sessizdir).
          type: string
          enum: [IN_HALL, AMBIGUOUS, NO_SIGNAL]
        currentHallName:
          description: currentStatus=IN_HALL ise bulundugu salon.
          type: string
          nullable: true
        outlierRejectionRate:
          description: >
            Reddedilen (sentinel veya Hampel outlier) okumalarin toplam
            okumalara orani. Sayaclar gecici olarak Redis'te tutulur; veri
            yoksa null doner.
          type: number
          nullable: true

    TrackingHealth:
      type: object
      required:
        - items
        - summary
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackingHealthItem'
        summary:
          type: object
          required:
            - aktif
            - yakinZamanda
            - veriYok
          properties:
            aktif:
              type: integer
            yakinZamanda:
              type: integer
            veriYok:
              type: integer
            icerde:
              type: integer
            belirsiz:
              type: integer
            sinyalYok:
              type: integer

    DataQualityReport:
      type: object
      required:
        - totalObservations
        - matchedObservations
        - unmatchedObservations
        - matchedRatio
      properties:
        totalObservations:
          type: integer
        matchedObservations:
          type: integer
        unmatchedObservations:
          type: integer
        matchedRatio:
          type: number
          nullable: true

    BeaconHealthItem:
      type: object
      required:
        - beaconId
        - label
        - major
        - minor
        - assignedHallName
        - isAssigned
        - observationCount
        - lastSeenAt
      properties:
        beaconId:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        major:
          type: integer
        minor:
          type: integer
        assignedHallName:
          type: string
          nullable: true
        isAssigned:
          type: boolean
        observationCount:
          type: integer
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        averageRssi:
          description: >
            Ortalama sinyal gucu (dBm). Sentinel (rssi >= 0) okumalar haric
            tutulur; hic gecerli okuma yoksa null.
          type: number
          nullable: true
        usersSeenCount:
          description: Bu beacon'i goren farkli katilimci sayisi (kapsama gostergesi).
          type: integer

    Session:
      type: object
      required:
        - id
        - congressId
        - hallId
        - title
        - speaker
        - startTime
        - endTime
        - description
        - sessionType
        - dayLabel
        - keywords
        - displayOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        congressId:
          type: string
          format: uuid
        hallId:
          type: string
          format: uuid
        title:
          type: string
        speaker:
          type: string
          nullable: true
          deprecated: true
          description: >-
            DEPRECATED (Faz 4a) - yeni programlarda moderator/konusmaci
            ProgramRole uzerinden eklenir. Yalnizca eski veri/panel gorunumu
            icin korunuyor, yeni yazimlarda kullanilmasi beklenmiyor.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        sessionType:
          type: string
          nullable: true
          description: 'Serbest metin, ornek: "Panel", "Sempozyum", "Kurs", "Ana Konusma", "Uydu Sempozyumu".'
        dayLabel:
          type: string
          nullable: true
          description: 'Programdaki gun etiketi, ornek: "1. Gun", "Calistaylar".'
        keywords:
          type: string
          nullable: true
          description: >-
            Virgulle ayrilmis anahtar kelimeler. Faz 9 (bildirimler) icin
            hazirlik - bu fazda kullanilmiyor.
        displayOrder:
          type: integer
          description: 'Siralama: dayLabel -> startTime -> displayOrder (esitlik bozucu).'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        presentations:
          type: array
          description: GET /sessions listesinde HER ZAMAN dolu doner (bos dizi olabilir).
          items:
            $ref: '#/components/schemas/Presentation'
        roles:
          type: array
          description: Dogrudan bu oturuma bagli roller (ornek moderator).
          items:
            $ref: '#/components/schemas/ProgramRole'

    SessionCreate:
      type: object
      required:
        - congressId
        - hallId
        - title
        - startTime
        - endTime
      properties:
        congressId:
          type: string
          format: uuid
        hallId:
          type: string
          format: uuid
        title:
          type: string
        speaker:
          type: string
          deprecated: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        description:
          type: string
        sessionType:
          type: string
        dayLabel:
          type: string
        keywords:
          type: string
        displayOrder:
          type: integer
          minimum: 0

    SessionUpdate:
      allOf:
        - $ref: '#/components/schemas/SessionCreate'

    AttendanceSummary:
      type: object
      required:
        - activeHalls
        - currentlyInsideTotal
        - hallOccupancy
        - participantsSeenToday
        - lastObservationAt
        - durationStats
      properties:
        activeHalls:
          type: integer
        currentlyInsideTotal:
          type: integer
        hallOccupancy:
          type: array
          items:
            $ref: '#/components/schemas/HallOccupancy'
        participantsSeenToday:
          type: integer
        lastObservationAt:
          type: string
          format: date-time
          nullable: true
        durationStats:
          type: array
          items:
            type: object
            required:
              - hallId
              - hallName
              - visitCount
              - averageMinutes
              - medianMinutes
            properties:
              hallId:
                type: string
                format: uuid
              hallName:
                type: string
              visitCount:
                type: integer
              averageMinutes:
                type: number
                nullable: true
              medianMinutes:
                type: number
                nullable: true
              averageConfidenceScore:
                description: >
                  Salon bazli ortalama guven yuzdesi (0-100). Yalnizca v3
                  kararlarindan hesaplanir - v2 kayitlari ayni alanda ham dB
                  marji tasidigi icin karistirilmaz.
                type: number
                nullable: true

    UserAttendanceSummary:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - totalMinutes
        - visitCount
        - distinctHallCount
        - entryCount
        - exitCount
        - currentlyInside
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        totalMinutes:
          description: Acik ziyaretlerde su ana kadarki sure de dahildir.
          type: number
        visitCount:
          type: integer
        distinctHallCount:
          type: integer
        entryCount:
          type: integer
        exitCount:
          type: integer
        averageConfidenceScore:
          type: number
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        currentlyInside:
          type: boolean

    DecisionTrace:
      description: >
        Bir kararin gerekcesi. Kesin bir sema zorunlu degildir; amaci saha
        testinde "neden bu salon secildi" sorusuna cevap verebilmektir.
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              hallId:
                type: string
                format: uuid
              percentage:
                type: number
              emaAverage:
                type: number
              passesThreshold:
                type: boolean
              beaconReadings:
                type: array
                items:
                  type: object
                  properties:
                    beaconId:
                      type: string
                      format: uuid
                    emaValue:
                      type: number
                    rawAccepted:
                      type: boolean
        runnerUpGapPct:
          type: number
        rejectedOutliers:
          type: integer
        algorithmVersion:
          type: string

    HallVisitTrace:
      type: object
      required:
        - visitId
        - userId
        - hallId
        - hallName
        - startedAt
        - isOpen
        - algorithmVersion
      properties:
        visitId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        hallId:
          type: string
          format: uuid
        hallName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        isOpen:
          type: boolean
        confidenceLevel:
          type: string
          nullable: true
        algorithmVersion:
          type: string
        entry:
          nullable: true
          type: object
          properties:
            occurredAt:
              type: string
              format: date-time
            confidenceScore:
              type: number
              nullable: true
            decisionTrace:
              $ref: '#/components/schemas/DecisionTrace'
        exit:
          nullable: true
          type: object
          properties:
            occurredAt:
              type: string
              format: date-time
            confidenceScore:
              type: number
              nullable: true
            decisionTrace:
              $ref: '#/components/schemas/DecisionTrace'

    HallVisitSummary:
      type: object
      required:
        - id
        - userFirstName
        - userLastName
        - hallId
        - hallName
        - startedAt
        - isOpen
        - algorithmVersion
      properties:
        id:
          type: string
          format: uuid
        userFirstName:
          type: string
        userLastName:
          type: string
        hallId:
          type: string
          format: uuid
        hallName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        isOpen:
          type: boolean
        confidenceLevel:
          type: string
          nullable: true
        algorithmVersion:
          type: string

    HallVisitPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HallVisitSummary'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    OccupancySeriesPoint:
      type: object
      required:
        - bucketStart
        - values
      properties:
        bucketStart:
          type: string
          format: date-time
        values:
          type: object
          description: hallId -> o bucket'taki tahmini kisi sayisi.
          additionalProperties:
            type: integer

    OccupancySeries:
      type: object
      required:
        - from
        - to
        - bucketMinutes
        - halls
        - points
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucketMinutes:
          type: integer
        halls:
          type: array
          items:
            type: object
            required:
              - hallId
              - hallName
            properties:
              hallId:
                type: string
                format: uuid
              hallName:
                type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/OccupancySeriesPoint'

    ObservedBeacon:
      type: object
      required:
        - uuid
        - major
        - minor
        - rssi
      properties:
        uuid:
          type: string
          format: uuid
        major:
          type: integer
