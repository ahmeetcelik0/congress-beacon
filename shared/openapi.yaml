  /admin/registrations/template.xlsx:
    get:
      summary: Katilimci import sablonu (xlsx) indir
      description: >-
        Basliklar + biri yurt disi numarali iki ornek satir icerir. Diger
        indirme uc noktalarinda oldugu gibi (/reports/hall-visits.csv)
        tarayici indirme linkleri icin Authorization basligi yerine
        ?token= query string de kabul edilir.
      operationId: getRegistrationTemplate
      tags:
        - Registrations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: xlsx dosyasi.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /admin/registrations/imports:
    post:
      summary: Katilimci Excel/CSV dosyasi yukle (taslak olusturur)
      description: >-
        .xlsx/.xls/.csv - en fazla 5 MB, en fazla 10.000 satir. Dosya
        ayristirilir, RegistrationImport (DRAFT) + satirlar kaydedilir;
        henuz hicbir User/CongressRegistration OLUSTURULMAZ - bunun icin
        onizleme sonrasi /approve cagrilmali.
      operationId: uploadRegistrationImport
      tags:
        - Registrations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - congressId
              properties:
                file:
                  type: string
                  format: binary
                congressId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Dosya ayristirildi, taslak olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationImportSummary'
        '400':
          description: Dosya okunamadi/desteklenmeyen format/satir siniri asildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: congressId ile eslesen bir kongre yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Bir kongrenin taslak/gecmis yuklemeleri
      operationId: listRegistrationImports
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Yukleme listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationImport'

  /admin/registrations/imports/{id}:
    get:
      summary: Bir yuklemenin satirlarini getir (sayfali, durum filtreli)
      operationId: getRegistrationImportDetail
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ImportRowStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Yukleme detayi + satirlar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationImportDetail'
        '404':
          description: Yukleme bulunamadi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations/imports/{id}/rows/{rowId}:
    patch:
      summary: Bir import satirini duzelt
      description: >-
        Yalnizca DRAFT durumundaki yuklemelerde. Kaydedince durum (INVALID/
        NEW/DUPLICATE/MATCHED) ve uyari yeniden hesaplanir.
      operationId: updateRegistrationImportRow
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegistrationImportRowRequest'
      responses:
        '200':
          description: Guncellenmis satir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationImportRow'
        '409':
          description: Yukleme artik DRAFT degil, duzenlenemez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations/imports/{id}/rows/{rowId}/exclude:
    post:
      summary: Satiri onaydan haric tut
      operationId: excludeRegistrationImportRow
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rowId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Satir EXCLUDED oldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationImportRow'
        '409':
          description: Yukleme artik DRAFT degil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations/imports/{id}/approve:
    post:
      summary: Yuklemeyi onayla, NEW/MATCHED satirlari kayitlara isle
      description: >-
        Tek transaction icinde calisir. DUPLICATE/INVALID/EXCLUDED satirlar
        atlanir. Onay sirasinda (parse ile onay arasinda DB degismisse)
        olusabilecek email/telefon cakismalari o satiri DUPLICATE'e cevirip
        atlar, transaction'i BOZMAZ.
      operationId: approveRegistrationImport
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Onay tamamlandi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationImportApproveResult'
        '409':
          description: Yukleme zaten sonuclandirilmis (DRAFT degil).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations/imports/{id}/cancel:
    post:
      summary: Taslak yuklemeyi iptal et
      operationId: cancelRegistrationImport
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Yukleme CANCELLED oldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationImport'
        '409':
          description: Yukleme zaten sonuclandirilmis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations:
    get:
      summary: Bir kongrenin katilimci listesi
      operationId: listRegistrations
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          description: Ad, soyad, e-posta, phone (E.164) ve phoneRaw uzerinde arar.
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RegistrationSource'
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Sayfalanmis katilimci listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
    post:
      summary: Katilimciyi manuel ekle
      description: >-
        E-posta veya telefondan en az biri zorunlu. Mevcut kullaniciyla
        (e-posta sonra telefon) eslesirse YENI KULLANICI OLUSTURULMAZ,
        yalnizca kayit eklenir/yeniden aktiflestirilir.
      operationId: createRegistration
      tags:
        - Registrations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationRequest'
      responses:
        '201':
          description: Kayit olusturuldu/yeniden aktiflestirildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          description: E-posta ve telefon ikisi de eksik.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Kullanici zaten bu kongreye aktif kayitli.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations/{id}:
    patch:
      summary: Katilimcinin ad/soyad/e-posta/telefon bilgisini duzenle
      description: id, CongressRegistration.id'dir (User.id degil).
      operationId: updateRegistration
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegistrationRequest'
      responses:
        '200':
          description: Guncellenmis kullanici.
        '409':
          description: E-posta/telefon baska bir kullaniciya ait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/registrations/{id}/deactivate:
    post:
      summary: Kaydi pasiflestir (isActive=false) - SILME degil
      operationId: deactivateRegistration
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Kayit pasiflestirildi.

  /admin/registrations/{id}/reactivate:
    post:
      summary: Kaydi yeniden aktiflestir (isActive=true)
      operationId: reactivateRegistration
      tags:
        - Registrations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Kayit aktiflestirildi.

  /admin/uploads:
    post:
      summary: Gorsel yukle (kapak, mekan, sponsor logosu, konusmaci fotografi)
      description: >-
        JPEG/PNG/WEBP, en fazla 2 MB. Dosya turu magic-byte imzasindan
        dogrulanir, uzantiya/istemcinin gonderdigi Content-Type'a GUVENILMEZ.
        Donen url sunucuda auth GEREKTIRMEDEN statik olarak sunulur
        (ornek: GET {serverUrl}/uploads/<congressId>/<uuid>.png).
      operationId: uploadFile
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - congressId
              properties:
                file:
                  type: string
                  format: binary
                congressId:
                  type: string
                  format: uuid
                purpose:
                  type: string
                  enum: [cover, venue, sponsor, speaker]
      responses:
        '201':
          description: Yuklendi.
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    example: /uploads/3537dc2a-6e96-4a03-bf6d-37447d11a1dd/9b1f...png
        '400':
          description: >-
            Desteklenmeyen format (magic-byte kontrolu basarisiz) veya
            congressId ile eslesen kongre yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Dosya 2 MB siniri asiyor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Yuklenen bir gorseli diskten sil
      description: >-
        Normalde ELLE cagirmaya gerek yoktur - bir icerik kaydi
        silindiginde/gorsel alani degistirildiginde backend eski dosyayi
        kendisi siler. Bu uc nokta cogunlukla yarim kalan (kaydedilmemis)
        yuklemeleri temizlemek icindir.
      operationId: deleteUpload
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
      responses:
        '200':
          description: Silme denendi (dosya zaten yoksa da basarili sayilir).
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean

  /admin/venues:
    get:
      summary: Bir kongrenin mekanlarini (otel/ana mekan) listele
      description: displayOrder alanina gore artan sirada doner.
      operationId: listVenues
      tags:
        - Content
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mekan listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venue'
    post:
      summary: Yeni mekan olustur
      operationId: createVenue
      tags:
        - Content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
      responses:
        '201':
          description: Mekan olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          description: congressId ile eslesen kongre bulunamadi.

  /admin/venues/reorder:
    post:
      summary: Mekanlarin gosterim sirasini topluca degistir
      description: >-
        Govdedeki ids dizisinin sirasina gore displayOrder degerleri 0'dan
        baslayarak yeniden yazilir. Tek istekte tum sira gonderilir (satir
