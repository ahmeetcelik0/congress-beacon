    get:
      summary: Bir rol icin aday katilimci listesi
      description: >-
        AMBIGUOUS'ta birebir searchName eslesen adaylar, UNMATCHED'te daha
        gevsek kelime-icerir aramasinin sonucu doner. Otomatik atama YAPMAZ -
        yalnizca yetkiliye secenek sunar (bkz. /link).
      operationId: getProgramRoleCandidates
