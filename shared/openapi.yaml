openapi: 3.0.3
info:
  title: Kongre Beacon API
  description: Kongre Beacon Sistemi backend API sozlesmesi.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Yerel gelistirme
paths:
  /health:
    get:
      summary: Servis saglik kontrolu
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Servis ayakta.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /auth/pilot-login:
    post:
      summary: Pilot/test girisi (katilimci onceden kayitli degil)
      description: >-
        Kongre kodu + ortak pilot erisim kodu dogrulanir; ayni kongrede
        firstName+lastName+phoneLast4 ile mevcut kullanici aranir, yoksa
        olusturulur. Bu akis yalnizca pilot/test icindir; gercek kongrede
        kayit sistemi entegrasyonu veya kisiye ozel dogrulama ile degistirilecektir.
      operationId: pilotLogin
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PilotLoginRequest'
      responses:
        '201':
          description: Giris basarili.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotLoginResponse'
        '400':
          description: Istek govdesi gecersiz (eksik/yanlis formatli alan).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: congressCode dogru ama congressAccessCode yanlis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: congressCode ile eslesen bir kongre yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/register:
    post:
      summary: Mobil cihazi giris yapmis kullaniciya kaydet
      operationId: registerDevice
      tags:
        - Devices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Cihaz kaydedildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.

  /observations:
    get:
      summary: Ham beacon gozlem akisi (debug/panel icin, sayfalanmis)
      operationId: listObservations
      tags:
        - Observations
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: hallId
          in: query
          required: false
          description: Bu salona su an veya gecmiste atanmis beacon'lara ait gozlemlerle filtreler.
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Sayfalanmis ham gozlem listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'

  /observations/batch:
    post:
      summary: Ham iBeacon anlik goruntu batch'ini gonder
      description: >-
        Mobil uygulama salon karari vermez; yalnizca o anda gorulen beacon'larin
        uuid/major/minor/rssi degerlerini icerir. Salon giris/cikis/sure hesabi
        backend'de yapilir. `observationId` idempotency anahtaridir; ayni deger
        tekrar gonderilirse duplicateCount'a sayilir, yeniden kayit olusturulmaz.
      operationId: submitObservationBatch
      tags:
        - Observations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationBatchRequest'
      responses:
        '201':
          description: Batch islendi (kismi kabul mumkun; sayaclara bakin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationBatchResponse'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.
        '403':
          description: deviceId bu kullaniciya ait degil.

  /admin/tracking-health:
    get:
      summary: Katilimci bazinda takip sagligi (son gozlem zamani ve durum)
      operationId: getTrackingHealth
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Takip sagligi listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingHealth'

  /reports/data-quality:
    get:
      summary: Gozlemlerin beacon eslesme orani (veri kalitesi)
      operationId: getDataQualityReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Veri kalitesi ozeti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityReport'

  /reports/beacon-health:
    get:
      summary: Beacon basina son gorulme zamani ve atama durumu
      operationId: getBeaconHealthReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Beacon sagligi listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BeaconHealthItem'

  /reports/hall-visits.csv:
    get:
      summary: Salon ziyaretlerini CSV olarak disa aktar
      description: >-
        AdminJwtGuard bu endpoint icin token'i Authorization header'inda veya
        (indirme linkleri header gonderemedigi icin) `token` query parametresinde kabul eder.
      operationId: exportHallVisitsCsv
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: hallId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isOpen
          in: query
          required: false
          schema:
            type: boolean
        - name: token
          in: query
          required: false
          description: Authorization header yerine kullanilabilecek admin JWT (yalnizca indirme linkleri icin).
          schema:
            type: string
      responses:
        '200':
          description: CSV dosyasi.
          content:
            text/csv:
              schema:
                type: string

  /sessions:
    get:
      summary: Kongredeki bilimsel program oturumlarini listele
      operationId: listSessions
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Oturum listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      summary: Yeni bilimsel program oturumu olustur (10dk oncesi bildirim otomatik zamanlanir)
      operationId: createSession
      tags:
        - Sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Olusturulan oturum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /sessions/{id}:
    patch:
      summary: Oturumu guncelle (bildirim zamanlamasi yeniden hesaplanir)
      operationId: updateSession
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: Guncellenen oturum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    delete:
      summary: Oturumu sil (zamanlanmis bildirimi de iptal eder)
      operationId: deleteSession
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Silindi.

  /devices/push-token:
    put:
      summary: Cihazin push token'ini guncelle
      operationId: updatePushToken
      tags:
        - Devices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deviceId
                - pushToken
              properties:
                deviceId:
                  type: string
                  format: uuid
                pushToken:
                  type: string
      responses:
        '200':
          description: Guncellenen cihaz.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '403':
          description: deviceId bu kullaniciya ait degil.

  /notifications/opened:
    post:
      summary: Katilimci bir bildirime dokundugunda cagirir (analitik icin)
      operationId: markNotificationOpened
      tags:
        - Notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notificationLogId
              properties:
                notificationLogId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Guncellenen bildirim kaydi.
        '403':
          description: Bu bildirim bu kullaniciya ait degil.

  /attendance/summary:
    get:
      summary: Kongre icin canli katilim/doluluk ozeti (panel KPI'lari)
      operationId: getAttendanceSummary
      tags:
        - Attendance
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ozet veri.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSummary'

  /attendance/hall-visits:
    get:
      summary: Katilimci salon ziyaret gecmisi (sayfalanmis)
      operationId: listHallVisits
      tags:
        - Attendance
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: hallId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isOpen
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          description: Katilimci ad/soyad icinde arama (kismi eslesme).
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Sayfalanmis ziyaret listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallVisitPage'

  /attendance/hall-visits/{id}/trace:
    get:
      summary: Bir ziyaretin karar gerekcesi (decision trace)
      description: >-
        Ziyaretin giris ve (varsa) cikis kararini ureten ayrintilari doner:
        aday salonlar, yumusatilmis (EMA) degerler, guven yuzdeleri, en yakin
        rakiple fark ve elenen anormal okuma sayisi. Panel debug gorunumu icin.
      operationId: getHallVisitTrace
      tags:
        - Attendance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ziyaretin karar izi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallVisitTrace'
        '404':
          description: Ziyaret bulunamadi.

  /attendance/users/{userId}/summary:
    get:
      summary: Katilimci bazinda katilim ozeti
      description: >-
        Toplam kalis suresi, ziyaret edilen salon sayisi, giris/cikis sayisi,
        ortalama guven skoru ve ilk/son gorulme zamani.
      operationId: getUserAttendanceSummary
      tags:
        - Attendance
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Katilimci ozeti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAttendanceSummary'
        '404':
          description: Kullanici bulunamadi.

  /attendance/occupancy-series:
    get:
      summary: Zaman-dilimli salon doluluk serisi (yogunluk grafigi icin)
      description: >-
        HallVisit araliklarindan hesaplanir; her bucket icin salon basina
        o an icerideki tahmini kisi sayisini doner. `from`/`to` verilmezse
        varsayilan bugun 00:00 - simdi araligidir.
      operationId: getOccupancySeries
      tags:
        - Attendance
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: hallId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: bucketMinutes
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 15
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Zaman serisi verisi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancySeries'

  /mobile/bootstrap:
    get:
      summary: Mobil uygulama icin kongre/salon/beacon konfigurasyonu
      description: >-
        Mobil uygulamanin bir kongredeki salonlari ve her salona aktif olarak
        atanmis beacon'larin major/minor degerlerini tek response'ta almasini saglar.
      operationId: getMobileBootstrap
      tags:
        - Mobile
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bootstrap verisi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileBootstrap'
        '400':
          description: congressId gecersiz veya eksik.
        '404':
          description: Kongre bulunamadi.

  /congresses:
    post:
      summary: Yeni kongre olustur
      operationId: createCongress
      tags:
        - Congress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CongressCreate'
      responses:
        '201':
          description: Kongre olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Congress'
        '400':
          description: Gecersiz istek govdesi.
    get:
      summary: Kongreleri listele
      operationId: listCongresses
      tags:
        - Congress
      responses:
        '200':
          description: Kongre listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Congress'

  /congresses/{id}:
    get:
      summary: Tek bir kongreyi getir
      operationId: getCongress
      tags:
        - Congress
      parameters:
        - $ref: '#/components/parameters/CongressId'
      responses:
        '200':
          description: Kongre bulundu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Congress'
        '404':
          description: Kongre bulunamadi.
    patch:
      summary: Kongreyi guncelle
      operationId: updateCongress
      tags:
        - Congress
      parameters:
        - $ref: '#/components/parameters/CongressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CongressUpdate'
      responses:
        '200':
          description: Kongre guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Congress'
        '404':
          description: Kongre bulunamadi.
    delete:
      summary: Kongreyi sil
      operationId: deleteCongress
      tags:
        - Congress
      parameters:
        - $ref: '#/components/parameters/CongressId'
      responses:
        '204':
          description: Kongre silindi.
        '404':
          description: Kongre bulunamadi.

  /halls:
    post:
      summary: Yeni salon olustur
      operationId: createHall
      tags:
        - Hall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HallCreate'
      responses:
        '201':
          description: Salon olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
        '400':
          description: Gecersiz istek govdesi.
        '404':
          description: congressId ile eslesen kongre bulunamadi.
    get:
      summary: Salonlari listele
      operationId: listHalls
      tags:
        - Hall
      parameters:
        - name: congressId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Salon listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hall'

  /halls/{id}:
    get:
      summary: Tek bir salonu getir
      operationId: getHall
      tags:
        - Hall
      parameters:
        - $ref: '#/components/parameters/HallId'
      responses:
        '200':
          description: Salon bulundu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
        '404':
          description: Salon bulunamadi.
    patch:
      summary: Salonu guncelle (isim, rssiThreshold, capacity)
      operationId: updateHall
      tags:
        - Hall
      parameters:
        - $ref: '#/components/parameters/HallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HallUpdate'
      responses:
        '200':
          description: Salon guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hall'
        '404':
          description: Salon bulunamadi.
    delete:
      summary: Salonu sil
      operationId: deleteHall
      tags:
        - Hall
      parameters:
        - $ref: '#/components/parameters/HallId'
      responses:
        '204':
          description: Salon silindi.
        '404':
          description: Salon bulunamadi.

  /beacons:
    post:
      summary: Yeni beacon olustur
      operationId: createBeacon
      tags:
        - Beacon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeaconCreate'
      responses:
        '201':
          description: Beacon olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beacon'
        '400':
          description: Gecersiz istek govdesi.
        '404':
          description: congressId ile eslesen kongre bulunamadi.
        '409':
          description: Ayni kongrede ayni (uuid, major, minor) kombinasyonu zaten var.
    get:
      summary: Beacon'lari listele
      operationId: listBeacons
      tags:
        - Beacon
      parameters:
        - name: congressId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Beacon listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Beacon'

  /beacons/{id}:
    get:
      summary: Tek bir beacon'i getir
      operationId: getBeacon
      tags:
        - Beacon
      parameters:
        - $ref: '#/components/parameters/BeaconId'
      responses:
        '200':
          description: Beacon bulundu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beacon'
        '404':
          description: Beacon bulunamadi.
    patch:
      summary: Beacon'i guncelle (congressId haric)
      operationId: updateBeacon
      tags:
        - Beacon
      parameters:
        - $ref: '#/components/parameters/BeaconId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeaconUpdate'
      responses:
        '200':
          description: Beacon guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beacon'
        '404':
          description: Beacon bulunamadi.
        '409':
          description: Ayni kongrede ayni (uuid, major, minor) kombinasyonu zaten var.
    delete:
      summary: Beacon'i sil
      operationId: deleteBeacon
      tags:
        - Beacon
      parameters:
        - $ref: '#/components/parameters/BeaconId'
      responses:
        '204':
          description: Beacon silindi.
        '404':
          description: Beacon bulunamadi.

  /halls/{hallId}/beacons:
    get:
      summary: Salona aktif olarak atanmis beacon'lari listele
      operationId: listActiveHallBeacons
      tags:
        - HallBeacon
      parameters:
        - $ref: '#/components/parameters/HallIdPath'
      responses:
        '200':
          description: Aktif atama listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HallBeacon'
        '404':
          description: Salon bulunamadi.

  /halls/{hallId}/beacons/{beaconId}:
    post:
      summary: Beacon'i salona ata
      description: >-
        Beacon'in zaten baska bir salonda aktif bir atamasi varsa 409 doner;
        once o atama DELETE ile kaldirilmalidir.
      operationId: assignHallBeacon
      tags:
        - HallBeacon
      parameters:
        - $ref: '#/components/parameters/HallIdPath'
        - $ref: '#/components/parameters/BeaconIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HallBeaconAssign'
      responses:
        '201':
          description: Atama olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallBeacon'
        '404':
          description: Salon veya beacon bulunamadi.
        '409':
          description: Beacon zaten baska bir salona aktif olarak atanmis.
    delete:
      summary: Beacon'in bu salondaki aktif atamasini kaldir
      operationId: unassignHallBeacon
      tags:
        - HallBeacon
      parameters:
        - $ref: '#/components/parameters/HallIdPath'
        - $ref: '#/components/parameters/BeaconIdPath'
      responses:
        '200':
          description: Atama kaldirildi (isActive=false, removedAt set edildi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallBeacon'
        '404':
          description: Bu salon icin aktif bir atama bulunamadi.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CongressId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HallId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeaconId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HallIdPath:
      name: hallId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeaconIdPath:
      name: beaconId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HallOccupancy:
      type: object
      required:
        - hallId
        - hallName
        - count
      properties:
        hallId:
          type: string
          format: uuid
        hallName:
          type: string
        count:
          type: integer

    TrackingHealthItem:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - devicePlatform
        - deviceAppVersion
        - lastObservationAt
        - status
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        devicePlatform:
          type: string
          nullable: true
          enum: [IOS, ANDROID, null]
        deviceAppVersion:
          type: string
          nullable: true
        lastObservationAt:
          type: string
          format: date-time
          nullable: true
        status:
          description: Cihazin veri gonderme sagligi (son gozlem zamanina gore).
          type: string
          enum: [aktif, yakin_zamanda, veri_yok]
        currentStatus:
          description: >
            Katilimcinin salon tespit algoritmasina gore anlik durumu.
            NO_SIGNAL iki durumu birlestirir: sinyal var ama hicbir salon
            esigini gecmiyor, ya da cihaz tamamen sessiz. Ayrim `status`
            alaniyla yapilir (status=veri_yok ise cihaz sessizdir).
          type: string
          enum: [IN_HALL, AMBIGUOUS, NO_SIGNAL]
        currentHallName:
          description: currentStatus=IN_HALL ise bulundugu salon.
          type: string
          nullable: true
        outlierRejectionRate:
          description: >
            Reddedilen (sentinel veya Hampel outlier) okumalarin toplam
            okumalara orani. Sayaclar gecici olarak Redis'te tutulur; veri
            yoksa null doner.
          type: number
          nullable: true

    TrackingHealth:
      type: object
      required:
        - items
        - summary
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackingHealthItem'
        summary:
          type: object
          required:
            - aktif
            - yakinZamanda
            - veriYok
          properties:
            aktif:
              type: integer
            yakinZamanda:
              type: integer
            veriYok:
              type: integer
            icerde:
              type: integer
            belirsiz:
              type: integer
            sinyalYok:
              type: integer

    DataQualityReport:
      type: object
      required:
        - totalObservations
        - matchedObservations
        - unmatchedObservations
        - matchedRatio
      properties:
        totalObservations:
          type: integer
        matchedObservations:
          type: integer
        unmatchedObservations:
          type: integer
        matchedRatio:
          type: number
          nullable: true

    BeaconHealthItem:
      type: object
      required:
        - beaconId
        - label
        - major
        - minor
        - assignedHallName
        - isAssigned
        - observationCount
        - lastSeenAt
      properties:
        beaconId:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        major:
          type: integer
        minor:
          type: integer
        assignedHallName:
          type: string
          nullable: true
        isAssigned:
          type: boolean
        observationCount:
          type: integer
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        averageRssi:
          description: >
            Ortalama sinyal gucu (dBm). Sentinel (rssi >= 0) okumalar haric
            tutulur; hic gecerli okuma yoksa null.
          type: number
          nullable: true
        usersSeenCount:
          description: Bu beacon'i goren farkli katilimci sayisi (kapsama gostergesi).
          type: integer

    Session:
      type: object
      required:
        - id
        - congressId
        - hallId
        - title
        - speaker
        - startTime
        - endTime
        - description
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        congressId:
          type: string
          format: uuid
        hallId:
          type: string
          format: uuid
        title:
          type: string
        speaker:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SessionCreate:
      type: object
      required:
        - congressId
        - hallId
        - title
        - startTime
        - endTime
      properties:
        congressId:
          type: string
          format: uuid
        hallId:
          type: string
          format: uuid
        title:
          type: string
        speaker:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        description:
          type: string

    SessionUpdate:
      allOf:
        - $ref: '#/components/schemas/SessionCreate'

    AttendanceSummary:
      type: object
      required:
        - activeHalls
        - currentlyInsideTotal
        - hallOccupancy
        - participantsSeenToday
        - lastObservationAt
        - durationStats
      properties:
        activeHalls:
          type: integer
        currentlyInsideTotal:
          type: integer
        hallOccupancy:
          type: array
          items:
            $ref: '#/components/schemas/HallOccupancy'
        participantsSeenToday:
          type: integer
        lastObservationAt:
          type: string
          format: date-time
          nullable: true
        durationStats:
          type: array
          items:
            type: object
            required:
              - hallId
              - hallName
              - visitCount
              - averageMinutes
              - medianMinutes
            properties:
              hallId:
                type: string
                format: uuid
              hallName:
                type: string
              visitCount:
                type: integer
              averageMinutes:
                type: number
                nullable: true
              medianMinutes:
                type: number
                nullable: true
              averageConfidenceScore:
                description: >
                  Salon bazli ortalama guven yuzdesi (0-100). Yalnizca v3
                  kararlarindan hesaplanir - v2 kayitlari ayni alanda ham dB
                  marji tasidigi icin karistirilmaz.
                type: number
                nullable: true

    UserAttendanceSummary:
      type: object
      required:
        - userId
        - firstName
        - lastName
        - totalMinutes
        - visitCount
        - distinctHallCount
        - entryCount
        - exitCount
        - currentlyInside
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        totalMinutes:
          description: Acik ziyaretlerde su ana kadarki sure de dahildir.
          type: number
        visitCount:
          type: integer
        distinctHallCount:
          type: integer
        entryCount:
          type: integer
        exitCount:
          type: integer
        averageConfidenceScore:
          type: number
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        currentlyInside:
          type: boolean

    DecisionTrace:
      description: >
        Bir kararin gerekcesi. Kesin bir sema zorunlu degildir; amaci saha
        testinde "neden bu salon secildi" sorusuna cevap verebilmektir.
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              hallId:
                type: string
                format: uuid
              percentage:
                type: number
              emaAverage:
                type: number
              passesThreshold:
                type: boolean
              beaconReadings:
                type: array
                items:
                  type: object
                  properties:
                    beaconId:
                      type: string
                      format: uuid
                    emaValue:
                      type: number
                    rawAccepted:
                      type: boolean
        runnerUpGapPct:
          type: number
        rejectedOutliers:
          type: integer
        algorithmVersion:
          type: string

    HallVisitTrace:
      type: object
      required:
        - visitId
        - userId
        - hallId
        - hallName
        - startedAt
        - isOpen
        - algorithmVersion
      properties:
        visitId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        hallId:
          type: string
          format: uuid
        hallName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        isOpen:
          type: boolean
        confidenceLevel:
          type: string
          nullable: true
        algorithmVersion:
          type: string
        entry:
          nullable: true
          type: object
          properties:
            occurredAt:
              type: string
              format: date-time
            confidenceScore:
              type: number
              nullable: true
            decisionTrace:
              $ref: '#/components/schemas/DecisionTrace'
        exit:
          nullable: true
          type: object
          properties:
            occurredAt:
              type: string
              format: date-time
            confidenceScore:
              type: number
              nullable: true
            decisionTrace:
              $ref: '#/components/schemas/DecisionTrace'

    HallVisitSummary:
      type: object
      required:
        - id
        - userFirstName
        - userLastName
        - hallId
        - hallName
        - startedAt
        - isOpen
        - algorithmVersion
      properties:
        id:
          type: string
          format: uuid
        userFirstName:
          type: string
        userLastName:
          type: string
        hallId:
          type: string
          format: uuid
        hallName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        isOpen:
          type: boolean
        confidenceLevel:
          type: string
          nullable: true
        algorithmVersion:
          type: string

    HallVisitPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HallVisitSummary'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    OccupancySeriesPoint:
      type: object
      required:
        - bucketStart
        - values
      properties:
        bucketStart:
          type: string
          format: date-time
        values:
          type: object
          description: hallId -> o bucket'taki tahmini kisi sayisi.
          additionalProperties:
            type: integer

    OccupancySeries:
      type: object
      required:
        - from
        - to
        - bucketMinutes
        - halls
        - points
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucketMinutes:
          type: integer
        halls:
          type: array
          items:
            type: object
            required:
              - hallId
              - hallName
            properties:
              hallId:
                type: string
                format: uuid
              hallName:
                type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/OccupancySeriesPoint'

    ObservedBeacon:
      type: object
      required:
        - uuid
        - major
        - minor
        - rssi
      properties:
        uuid:
          type: string
          format: uuid
        major:
          type: integer
          minimum: 0
          maximum: 65535
        minor:
          type: integer
          minimum: 0
          maximum: 65535
        rssi:
          type: integer
        txPower:
          type: integer
          nullable: true

    ObservationSnapshot:
      type: object
      required:
        - observationId
        - observedAt
        - beacons
      properties:
        observationId:
          type: string
          format: uuid
          description: Idempotency anahtari.
        observedAt:
          type: string
          format: date-time
        beacons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ObservedBeacon'
        appVersion:
          type: string

    ObservationBatchRequest:
      type: object
      required:
        - clientBatchId
        - deviceId
        - observations
      properties:
        clientBatchId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        observations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ObservationSnapshot'

    ObservationBatchResponse:
      type: object
      required:
        - acceptedCount
        - duplicateCount
        - rejectedCount
        - observationIntervalSeconds
      properties:
        acceptedCount:
          type: integer
        duplicateCount:
          type: integer
        rejectedCount:
          type: integer
        observationIntervalSeconds:
          type: integer
          description: >-
            Mobil cihazin bir sonraki batch'leri kac saniyede bir gondermesi
            gerektigi (kongre bazli, panelden ayarlanir). Mobil her batch
            gonderiminde bu degeri okuyup gonderim zamanlayicisini gunceller.

    ObservationSummary:
      type: object
      required:
        - id
        - observationId
        - userId
        - observedAt
        - serverReceivedAt
        - uuid
        - major
        - minor
        - rssi
      properties:
        id:
          type: string
          format: uuid
        observationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        observedAt:
          type: string
          format: date-time
        serverReceivedAt:
          type: string
          format: date-time
        beaconId:
          type: string
          format: uuid
          nullable: true
        uuid:
          type: string
        major:
          type: integer
        minor:
          type: integer
        rssi:
          type: integer
        txPower:
          type: integer
          nullable: true
        appVersion:
          type: string
          nullable: true

    ObservationPage:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ObservationSummary'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    RegisterDeviceRequest:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          enum: [IOS, ANDROID]
        deviceModel:
          type: string
        osVersion:
          type: string
        appVersion:
          type: string
        pushToken:
          type: string

    Device:
      type: object
      required:
        - id
        - userId
        - platform
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [IOS, ANDROID]
        deviceModel:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        pushToken:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PilotLoginRequest:
      type: object
      required:
        - congressCode
        - congressAccessCode
        - firstName
        - lastName
        - phoneLast4
      properties:
        congressCode:
          type: string
          minLength: 2
        congressAccessCode:
          type: string
          minLength: 4
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phoneLast4:
          type: string
          pattern: '^\d{4}$'
          description: Telefon numarasinin son 4 hanesi (yalnizca eslestirme icin, raporlarda gosterilmez).

    PilotLoginResponse:
      type: object
      required:
        - accessToken
        - user
        - congress
      properties:
        accessToken:
          type: string
          description: >-
            JWT (7 gun gecerli). Sonraki isteklerde "Authorization: Bearer
            <accessToken>" basligi olarak gonderilir.
        user:
          type: object
          required:
            - id
            - firstName
            - lastName
            - role
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            role:
              type: string
              enum: [PARTICIPANT, ADMIN]
        congress:
          type: object
          required:
            - id
            - name
            - code
            - beaconUuid
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            code:
              type: string
            beaconUuid:
              type: string
              format: uuid

    ErrorResponse:
      type: object
      description: NestJS varsayilan hata govdesi formati.
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          example: 401
        message:
          description: >-
            Tek bir hata icin string, class-validator dogrulama hatalari
            icin (400) string dizisi olabilir.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          example: Unauthorized

    Congress:
      type: object
      required:
        - id
        - name
        - code
        - accessCode
        - beaconUuid
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          description: Kisa, insan-okunabilir kongre kodu (pilot login icin kullanilir).
        accessCode:
          type: string
          description: Pilot ortak erisim kodu (gercek kongrede kayit sistemiyle degisecek).
        beaconUuid:
          type: string
          format: uuid
          description: Kongreye ait ortak iBeacon UUID'i.
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        observationIntervalSeconds:
          type: integer
          description: >-
            Mobil cihazlarin observation batch gonderim sikligi (saniye).
            Panelden (canli takip sayfasi) ayarlanir.
        emaAlpha:
          type: number
          description: >-
            EMA yumusatma katsayisi. 1'e yaklastikca sistem yeni olcume daha
            hizli tepki verir, gurultuye de daha acik olur.
        hampelK:
          type: number
          description: Hampel outlier filtresinin siddeti (kucukse daha cok okuma elenir).
        hampelWindowSize:
          type: integer
          description: Outlier tespitinde bakilan son okuma sayisi.
        confidenceTemperature:
          type: number
          description: Softmax sicakligi; buyudukce salon yuzdeleri birbirine yaklasir.
        entryProbabilityThreshold:
          type: number
          description: Giris icin gereken guven yuzdesi. Cikis esiginden buyuk olmalidir.
        exitProbabilityThreshold:
          type: number
          description: Altina dusuldugunde cikis sayilan guven yuzdesi.
        ambiguityMarginPct:
          type: number
          description: >-
            Ilk iki salonun yuzde farki bunun altindaysa sistem taraf secmez
            (AMBIGUOUS) ve ne giris ne cikis tetikler.
        staleGraceSeconds:
          type: number
          description: >-
            Bir beacon'in son gecerli okumasindan sonra kac saniye daha
            "hala guvenilir" sayilip son bilinen (donmus) EMA'siyla salon
            ortalamasina dahil edilmeye devam edecegi. Tek beacon'li bir
            salonun kisa sureli sinyal kesintisinde rakip salona sahte
            gecisi (aninda EXIT+ENTRY) onlemek icin eklendi.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CongressCreate:
      type: object
      required:
        - name
        - code
        - accessCode
        - beaconUuid
      properties:
        name:
          type: string
          minLength: 2
        code:
          type: string
          minLength: 2
        accessCode:
          type: string
          minLength: 4
        beaconUuid:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        observationIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 300
          default: 10
        emaAlpha:
          type: number
          minimum: 0.01
          maximum: 1
          default: 0.35
        hampelK:
          type: number
          minimum: 0.5
          maximum: 10
          default: 3
        hampelWindowSize:
          type: integer
          minimum: 3
          maximum: 20
          default: 5
        confidenceTemperature:
          type: number
          minimum: 0.5
          maximum: 50
          default: 8
        entryProbabilityThreshold:
          type: number
          minimum: 0
          maximum: 100
          default: 60
        exitProbabilityThreshold:
          type: number
          minimum: 0
          maximum: 100
          default: 40
        ambiguityMarginPct:
          type: number
          minimum: 0
          maximum: 50
          default: 5
        staleGraceSeconds:
          type: number
          minimum: 0
          maximum: 60
          default: 5

    CongressUpdate:
      type: object
      description: CongressCreate ile ayni alanlar, hepsi opsiyonel (PATCH).
      properties:
        name:
          type: string
          minLength: 2
        code:
          type: string
          minLength: 2
        accessCode:
          type: string
          minLength: 4
        beaconUuid:
          type: string
          format: uuid
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        observationIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 300
        emaAlpha:
          type: number
          minimum: 0.01
          maximum: 1
        hampelK:
          type: number
          minimum: 0.5
          maximum: 10
        hampelWindowSize:
          type: integer
          minimum: 3
          maximum: 20
        confidenceTemperature:
          type: number
          minimum: 0.5
          maximum: 50
        entryProbabilityThreshold:
          type: number
          minimum: 0
          maximum: 100
        exitProbabilityThreshold:
          type: number
          minimum: 0
          maximum: 100
        ambiguityMarginPct:
          type: number
          minimum: 0
          maximum: 50
        staleGraceSeconds:
          type: number
          minimum: 0
          maximum: 60

    Hall:
      type: object
      required:
        - id
        - congressId
        - name
        - rssiThreshold
        - capacity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        congressId:
          type: string
          format: uuid
        name:
          type: string
        rssiThreshold:
          type: integer
          description: Salon icinde kabul edilen minimum RSSI (dBm). Varsayilan -70.
          example: -70
        capacity:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Salon kapasitesi (kisi). null = kapasite tanimlanmamis (0 ile
            karistirilmaz). Dolulukyuzdesi hesaplamasi bu alani kullanir ama
