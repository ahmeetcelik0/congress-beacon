          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Aday katilimci listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgramRoleCandidate'
        '404':
          description: Rol bulunamadi.

  /admin/program-imports/estimate:
    post:
      summary: PDF/Excel program dosyasi icin token/maliyet tahmini (para harcamaz)
      description: >-
        Yalnizca girdi token sayisini olcer (Anthropic'in countTokens'i
        ucretsizdir) ve tahmini cikti/maliyeti hesaplar - hicbir LLM cikarimi
        YAPMAZ. Panel bu tahmini gosterip acik onay almadan cikarimi
        baslatmaz.
      operationId: estimateProgramImport
      tags:
        - Program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - congressId
              properties:
                file:
                  type: string
                  format: binary
                congressId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tahmin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramImportEstimate'
        '400':
          description: Desteklenmeyen format (.pdf/.xlsx/.xls disi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: congressId ile eslesen bir kongre yok.
        '503':
          description: ANTHROPIC_API_KEY yapilandirilmamis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/program-imports:
    post:
      summary: PDF/Excel program dosyasi yukle, cikarimi kuyruga al
      description: >-
        En fazla 32 MB. Dosya asenkron olarak islenir (BullMQ) - bu uc nokta
        aninda PENDING doner, LLM cagrisini BEKLEMEZ. Ilerleme
        GET /admin/program-imports/{id} ile sorgulanir.
      operationId: createProgramImport
      tags:
        - Program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - congressId
              properties:
                file:
                  type: string
                  format: binary
                congressId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Kuyruga alindi.
          content:
            application/json:
              schema:
                type: object
                required: [importId, status]
                properties:
                  importId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/ProgramImportStatus'
        '404':
          description: congressId ile eslesen bir kongre yok.
        '503':
          description: ANTHROPIC_API_KEY yapilandirilmamis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Bir kongrenin program yuklemeleri (gecmis + durum)
      operationId: listProgramImports
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Yukleme listesi + kongre bazinda toplam LLM harcamasi.
          content:
            application/json:
              schema:
                type: object
                required: [imports, totalSpendUsd]
                properties:
                  imports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProgramImport'
                  totalSpendUsd:
                    type: number

