      type: string
      enum: [MODERATOR, SPEAKER, DISCUSSANT]
      description: MODERATOR = oturum baskani, SPEAKER = konusmaci, DISCUSSANT = tartismaci.

    RoleMatchStatus:
      type: string
      enum: [MATCHED, AMBIGUOUS, UNMATCHED, MANUAL, IGNORED]
      description: >-
        MATCHED = otomatik eslesti (tek aday). AMBIGUOUS = birden fazla aday,
        yetkili secmeli. UNMATCHED = aday yok. MANUAL = yetkili elle bagladi.
        IGNORED = yetkili "bu kisi katilimci degil" dedi. MANUAL ve IGNORED
        rematch ile ASLA degistirilmez.

    ProgramRoleUser:
      type: object
      description: Rolun eslestigi katilimcinin panelde gosterilecek asgari alanlari.
      required:
        - id
        - firstName
        - lastName
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        phoneRaw:
          type: string
          nullable: true

    ProgramRole:
      type: object
      required:
        - id
        - sessionId
        - presentationId
        - type
        - rawName
        - searchName
        - userId
        - matchStatus
        - displayOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          nullable: true
        presentationId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/ProgramRoleType'
        rawName:
          type: string
          description: 'Programda yazdigi hali, ornek: "Prof. Dr. Ahmet Yilmaz".'
        searchName:
          type: string
          description: normalizeTurkishName(rawName) - unvansiz, ASCII, kucuk harf.
        userId:
          type: string
          format: uuid
          nullable: true
        matchStatus:
          $ref: '#/components/schemas/RoleMatchStatus'
        displayOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          allOf:
            - $ref: '#/components/schemas/ProgramRoleUser'
          nullable: true

    ProgramRoleCreate:
      type: object
      description: >-
        sessionId/presentationId'den TAM OLARAK biri gonderilmelidir - ikisi
        de dolu ya da ikisi de bos gelirse 400.
      required:
        - type
        - rawName
      properties:
        sessionId:
          type: string
          format: uuid
        presentationId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ProgramRoleType'
        rawName:
          type: string
          minLength: 1

    ProgramRoleUpdate:
      type: object
      description: >-
        sessionId/presentationId burada YOK (bir rolun bagli oldugu
        oturum/sunum degistirilemez). rawName degisirse eslesme otomatik
        yeniden hesaplanir.
      properties:
        type:
          $ref: '#/components/schemas/ProgramRoleType'
        rawName:
          type: string
          minLength: 1

    ProgramRoleMatch:
      description: ProgramRole + ait oldugu oturum/sunumun ozet bilgisi (matches listesinde).
      allOf:
        - $ref: '#/components/schemas/ProgramRole'
        - type: object
          properties:
            session:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                congressId:
                  type: string
                  format: uuid
            presentation:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                session:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    congressId:
                      type: string
                      format: uuid

