openapi: 3.0.3
info:
  title: Kongre Beacon API
  description: Kongre Beacon Sistemi backend API sozlesmesi.
  version: 0.1.0
servers:
  - url: http://localhost:3001
    description: Yerel gelistirme
paths:
  /health:
    get:
      summary: Servis saglik kontrolu
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Servis ayakta.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /auth/pilot-login:
    post:
      summary: Pilot/test girisi (katilimci onceden kayitli degil)
      description: >-
        Kongre kodu + ortak pilot erisim kodu dogrulanir; ayni kongrede
        firstName+lastName+phoneLast4 ile mevcut kullanici aranir, yoksa
        olusturulur. Bu akis yalnizca pilot/test icindir; gercek kongrede
        kayit sistemi entegrasyonu veya kisiye ozel dogrulama ile degistirilecektir.
      operationId: pilotLogin
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PilotLoginRequest'
      responses:
        '201':
          description: Giris basarili.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotLoginResponse'
        '400':
          description: Istek govdesi gecersiz (eksik/yanlis formatli alan).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: congressCode dogru ama congressAccessCode yanlis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: congressCode ile eslesen bir kongre yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register-request:
    post:
      summary: Ilk giristen once dogrulama kodu iste
      description: >-
        emailOrPhone icin aktif bir CongressRegistration'i olan bir kullanici
        aranir; varsa 6 haneli bir kod uretilip GECICI SIFRE olarak kaydedilir
        (mustChangePassword=true) ve e-postaya gonderilir. IP+hedef basina
        dakikada 1, saatte 5 istekle sinirlidir.
      operationId: registerRequest
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOrPhoneRequest'
      responses:
        '201':
          description: Kod uretildi ve gonderildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Bu bilgiyle kayitli aktif bir kongre kaydi yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Kayitta e-posta adresi yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Istek sinirini asti.

  /auth/login:
    post:
      summary: E-posta/telefon + sifre ile giris
      description: >-
        Basarili giriste activeCongressId NULL olan bir token doner;
        kullanici /auth/select-congress ile kongre secmeli. IP basina
        dakikada 10 istekle sinirlidir.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Giris basarili.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: E-posta/telefon veya sifre hatali.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Istek sinirini asti.

  /auth/me:
    get:
      summary: Giris yapmis kullanicinin profili ve kongre listesi
      description: >-
        Mobil uygulama her acilista bunu cagirip token'in gecerliligini
        dogrular ve profil/kongre listesini tazeler.
      operationId: getMe
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil bilgisi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/change-password:
    post:
      summary: Sifre degistir
      description: >-
        Basarili degisiklikte tum diger oturumlar duser (tokenVersion artar);
        bu istekten donen YENI accessToken ayni aktif kongre secimini tasir.
      operationId: changePassword
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '201':
          description: Sifre degisti, yeni token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Token gecersiz veya mevcut sifre hatali.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      summary: Sifremi unuttum - dogrulama kodu iste
      description: /auth/register-request ile ayni akis ve limitler.
      operationId: forgotPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOrPhoneRequest'
      responses:
        '201':
          description: Kod uretildi ve gonderildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Bu bilgiyle kayitli aktif bir kongre kaydi yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Kayitta e-posta adresi yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Istek sinirini asti.

  /auth/my-congresses:
    get:
      summary: Kullanicinin aktif kayitli oldugu kongreler
      operationId: getMyCongresses
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Kongre listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCongressesResponse'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/select-congress:
    post:
      summary: Aktif kongreyi sec
      description: >-
        Kullanicinin o kongrede aktif bir CongressRegistration'i olmali.
        Eski token gecerliligini korur (tokenVersion artmaz), yalnizca yeni
        secim yeni bir token'a tasinir.
      operationId: selectCongress
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectCongressRequest'
      responses:
        '201':
          description: Kongre secildi, yeni token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '403':
          description: Kullanicinin bu kongrede aktif kaydi yok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /devices/register:
    post:
      summary: Mobil cihazi giris yapmis kullaniciya kaydet
      operationId: registerDevice
      tags:
        - Devices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Cihaz kaydedildi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.

  /observations:
    get:
      summary: Ham beacon gozlem akisi (debug/panel icin, sayfalanmis)
      operationId: listObservations
      tags:
        - Observations
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: hallId
          in: query
          required: false
          description: Bu salona su an veya gecmiste atanmis beacon'lara ait gozlemlerle filtreler.
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Sayfalanmis ham gozlem listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'

  /observations/batch:
    post:
      summary: Ham iBeacon anlik goruntu batch'ini gonder
      description: >-
        Mobil uygulama salon karari vermez; yalnizca o anda gorulen beacon'larin
        uuid/major/minor/rssi degerlerini icerir. Salon giris/cikis/sure hesabi
        backend'de yapilir. `observationId` idempotency anahtaridir; ayni deger
        tekrar gonderilirse duplicateCount'a sayilir, yeniden kayit olusturulmaz.
      operationId: submitObservationBatch
      tags:
        - Observations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationBatchRequest'
      responses:
        '201':
          description: Batch islendi (kismi kabul mumkun; sayaclara bakin).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationBatchResponse'
        '401':
          description: Token eksik, gecersiz veya suresi dolmus.
        '403':
          description: deviceId bu kullaniciya ait degil.

  /admin/tracking-health:
    get:
      summary: Katilimci bazinda takip sagligi (son gozlem zamani ve durum)
      operationId: getTrackingHealth
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Takip sagligi listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingHealth'

  /reports/data-quality:
    get:
      summary: Gozlemlerin beacon eslesme orani (veri kalitesi)
      operationId: getDataQualityReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Veri kalitesi ozeti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataQualityReport'

  /reports/beacon-health:
    get:
      summary: Beacon basina son gorulme zamani ve atama durumu
      operationId: getBeaconHealthReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Beacon sagligi listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BeaconHealthItem'

  /reports/hall-visits.csv:
    get:
      summary: Salon ziyaretlerini CSV olarak disa aktar
      description: >-
        AdminJwtGuard bu endpoint icin token'i Authorization header'inda veya
        (indirme linkleri header gonderemedigi icin) `token` query parametresinde kabul eder.
      operationId: exportHallVisitsCsv
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: hallId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isOpen
          in: query
          required: false
          schema:
            type: boolean
        - name: token
          in: query
          required: false
          description: Authorization header yerine kullanilabilecek admin JWT (yalnizca indirme linkleri icin).
          schema:
            type: string
      responses:
        '200':
          description: CSV dosyasi.
          content:
            text/csv:
              schema:
                type: string

  /sessions:
    get:
      summary: Kongredeki bilimsel program oturumlarini listele
      operationId: listSessions
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Oturum listesi.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      summary: Yeni bilimsel program oturumu olustur (10dk oncesi bildirim otomatik zamanlanir)
      operationId: createSession
      tags:
        - Sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Olusturulan oturum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /sessions/reorder:
    post:
      summary: Oturumlarin gosterim sirasini topluca degistir
      description: >-
        Govdedeki ids dizisinin sirasina gore displayOrder degerleri 0'dan
        baslayarak yeniden yazilir. Yalnizca gonderilen id'ler etkilenir -
        panel gun/salon filtresi uygulanmis GORUNEN listeyi gonderebilir,
        filtre disindaki oturumlara dokunulmaz.
      operationId: reorderSessions
      tags:
        - Sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '204':
          description: Sira guncellendi.

  /sessions/{id}:
    patch:
      summary: Oturumu guncelle (bildirim zamanlamasi yeniden hesaplanir)
      operationId: updateSession
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        '200':
          description: Guncellenen oturum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    delete:
      summary: Oturumu sil (zamanlanmis bildirimi de iptal eder)
      description: >-
        Cascade: altindaki tum sunumlar VE o sunumlarin/oturumun rolleri de
        silinir.
      operationId: deleteSession
      tags:
        - Sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Silindi.

  /admin/presentations:
    get:
      summary: Bir oturumun sunumlarini listele
      operationId: listPresentations
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: displayOrder'a gore sirali sunum listesi (roller dahil).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Presentation'
    post:
      summary: Oturuma yeni sunum ekle
      operationId: createPresentation
      tags:
        - Program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationCreate'
      responses:
        '201':
          description: Sunum olusturuldu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presentation'
        '404':
          description: sessionId ile eslesen oturum bulunamadi.

  /admin/presentations/reorder:
    post:
      summary: Bir oturumdaki sunumlarin sirasini topluca degistir
      operationId: reorderPresentations
      tags:
        - Program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '204':
          description: Sira guncellendi.

  /admin/presentations/{id}:
    patch:
      summary: Sunumu guncelle
      operationId: updatePresentation
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationUpdate'
      responses:
        '200':
          description: Guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presentation'
        '404':
          description: Sunum bulunamadi.
    delete:
      summary: Sunumu sil
      description: Cascade - bagli roller de silinir.
      operationId: deletePresentation
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Silindi.
        '404':
          description: Sunum bulunamadi.

  /admin/program-roles:
    post:
      summary: Yeni oturum/sunum rolu ekle (moderator/konusmaci/tartismaci)
      description: >-
        sessionId/presentationId'den TAM OLARAK biri gonderilmelidir - ikisi
        de dolu ya da ikisi de bos gelirse 400. Eslesme (matchStatus/userId)
        `rawName` uzerinden OTOMATIK hesaplanir, istekte gonderilmez.
      operationId: createProgramRole
      tags:
        - Program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRoleCreate'
      responses:
        '201':
          description: Rol olusturuldu, otomatik eslestirme uygulanmis halde doner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRole'
        '400':
          description: sessionId/presentationId ikisi birden dolu veya ikisi birden bos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/program-roles/rematch:
    post:
      summary: Bir kongredeki tum rolleri yeniden eslestir
      description: >-
        `MANUAL` ve `IGNORED` durumundaki roller ASLA degistirilmez (yetkilinin
        elle verdigi karar otomatik hesaplamayla ezilmez) - bu rollerin sayisi
        `skipped` alaninda doner. Katilimci listesi guncellendiginde (Faz 2
        akisiyla yeni kayit eklendiginde) calistirilir.
      operationId: rematchProgramRoles
      tags:
        - Program
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - congressId
              properties:
                congressId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Yeniden eslestirme ozeti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RematchSummary'

  /admin/program-roles/matches:
    get:
      summary: Bir kongredeki tum rollerin eslesme durumu denetim listesi
      operationId: listProgramRoleMatches
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: congressId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RoleMatchStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Sayfalanmis rol listesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRoleMatchesPage'

  /admin/program-roles/{id}:
    patch:
      summary: Rolu guncelle
      description: >-
        `rawName` degisirse `searchName`/`matchStatus`/`userId` OTOMATIK
        yeniden hesaplanir.
      operationId: updateProgramRole
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRoleUpdate'
      responses:
        '200':
          description: Guncellendi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRole'
        '404':
          description: Rol bulunamadi.
    delete:
      summary: Rolu sil
      operationId: deleteProgramRole
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Silindi.
        '404':
          description: Rol bulunamadi.

  /admin/program-roles/{id}/link:
    post:
      summary: Rolu elle bir katilimciya bagla (matchStatus = MANUAL olur)
      operationId: linkProgramRole
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Baglandi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRole'
        '404':
          description: Rol veya katilimci bulunamadi.

  /admin/program-roles/{id}/ignore:
    post:
      summary: Rolu "katilimci degil" olarak isaretle (matchStatus = IGNORED olur)
      operationId: ignoreProgramRole
      tags:
        - Program
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
